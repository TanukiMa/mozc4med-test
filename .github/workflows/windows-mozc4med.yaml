name: CI for Windows Mozc4med
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md

# Run manually.
on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Validate and apply patches
        shell: bash
        run: |
          python mozc4med/tool/validate_and_apply_patches.py mozc4med/common mozc4med/windows

      - name: Checkout mozc4med-dic-csv (private dictionary source)
        uses: actions/checkout@v6
        with:
          repository: TanukiMa/mozc4med-dic-csv
          token: ${{ secrets.DIC_CSV_PAT }}
          path: mozc4med-dic-csv
          persist-credentials: false

      - name: Generate mozc4med.tsv
        shell: bash
        run: |
          python mozc4med/tool/generate_mozc4med_dictionary.py \
            --input "mozc4med-dic-csv/example/*.csv" \
            --output src/data/dictionary_manual/mozc4med.tsv

      - name: Remove mozc4med.tsv duplicates from dictionary_oss
        shell: bash
        run: |
          python mozc4med/tool/rm_dictionary_entries.py \
            --mozc4med src/data/dictionary_manual/mozc4med.tsv \
            --dict-dir src/data/dictionary_oss \
            --apply

      - name: Append mozc4med collocation entries
        shell: bash
        run: |
          python mozc4med/tool/append_collocation_entries.py \
            --input "mozc4med-dic-csv/collocation/*.csv" \
            --target src/data/dictionary_oss/collocation.txt \
            --columns 1 \
            --apply

      - name: Append mozc4med collocation suppression entries
        shell: bash
        run: |
          python mozc4med/tool/append_collocation_entries.py \
            --input "mozc4med-dic-csv/collocation_suppression/*.csv" \
            --target src/data/dictionary_oss/collocation_suppression.txt \
            --columns 2 \
            --apply

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Install ImageMagick and Wand
        shell: pwsh
        run: |
          winget install --id ImageMagick.ImageMagick -e --source winget `
            --accept-source-agreements --accept-package-agreements --silent
          pip install Wand
          # winget installs don't refresh PATH for the current job, so add it explicitly
          # for later steps.
          $magickDir = Get-ChildItem "C:\Program Files\ImageMagick-*" -Directory | Select-Object -First 1
          $magickDir.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Patch icon SVG colors (hue shift)
        shell: pwsh
        run: |
          # Recolor the SVG sources in the runner's working copy only -- the
          # tracked repository files are left untouched. Shifts every color's
          # hue to red while preserving its saturation/lightness, so
          # gradients and shading are kept instead of just replacing one
          # hard-coded orange literal.
          python mozc4med/tool/hue_shift_svg.py --svg src/data/images/icon_base.svg --verbose
          python mozc4med/tool/hue_shift_svg.py --svg src/data/images/icon.svg --verbose

      - name: Generate red product icons
        shell: pwsh
        run: |
          python mozc4med/tool/generate_icon_from_svg.py `
            --svg src/data/images/icon_base.svg `
            --out src/data/images/win/product_icon_langbar.ico
          python mozc4med/tool/generate_icon_from_svg.py `
            --svg src/data/images/icon.svg `
            --out src/data/images/win/product_icon.ico

      - name: Colorize icons (red)
        shell: pwsh
        run: |
          # product_icon_langbar.ico and product_icon.ico are generated
          # separately (above) from SVG sources, so they are excluded here
          # to avoid re-processing them.
          python mozc4med/tool/colorize_icons.py --verbose `
            --exclude product_icon_langbar.ico `
            --exclude product_icon.ico

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config oss_windows --config release_build package

      - name: Check for upstream Mozc identity markers (Phase 2 guard)
        shell: bash
        run: |
          python mozc4med/tool/check_no_upstream_identifiers.py \
            --report check_no_upstream_identifiers_x64.tsv \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: upload upstream identifier check report (x64)
        uses: actions/upload-artifact@v6
        with:
          name: check-no-upstream-identifiers-x64
          path: check_no_upstream_identifiers_x64.tsv
          if-no-files-found: warn

      - name: upload Mozc4med_x64.msi
        uses: actions/upload-artifact@v6
        with:
          name: Mozc4med_x64.msi
          path: src/bazel-bin/win32/installer/Mozc4med.msi
          if-no-files-found: warn


  build_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Configure git identity
        run: |
