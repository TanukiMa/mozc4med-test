          if-no-files-found: warn


  test:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Validate and apply patches
        shell: bash
        run: |
          python mozc4med/tool/validate_and_apply_patches.py mozc4med/common mozc4med/windows

      - name: Checkout mozc4med-dic-csv (private dictionary source)
        uses: actions/checkout@v6
        with:
          repository: TanukiMa/mozc4med-dic-csv
          token: ${{ secrets.DIC_CSV_PAT }}
          path: mozc4med-dic-csv
          persist-credentials: false

      - name: Generate mozc4med.tsv
        shell: bash
        run: |
          python mozc4med/tool/generate_mozc4med_dictionary.py \
            --input "mozc4med-dic-csv/example/*.csv" \
            --output src/data/dictionary_manual/mozc4med.tsv

      - name: Remove mozc4med.tsv duplicates from dictionary_oss
        shell: bash
        run: |
          python mozc4med/tool/rm_dictionary_entries.py \
            --mozc4med src/data/dictionary_manual/mozc4med.tsv \
            --dict-dir src/data/dictionary_oss \
            --apply \
            --log-file rm_dictionary_entries.log \
            --removed-report rm_dictionary_entries_removed.tsv \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: upload dictionary removal log (test)
        uses: actions/upload-artifact@v6
        with:
          name: rm-dictionary-entries-log-test
          path: |
            rm_dictionary_entries.log
            rm_dictionary_entries_removed.tsv
          if-no-files-found: warn

      - name: Append mozc4med collocation entries
        shell: bash
        run: |
          python mozc4med/tool/append_collocation_entries.py \
            --input "mozc4med-dic-csv/collocation/*.csv" \
            --target src/data/dictionary_oss/collocation.txt \
            --columns 1 \
            --apply \
            --log-file append_collocation_entries.log \
            --added-report append_collocation_entries_added.tsv \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Append mozc4med collocation suppression entries
        shell: bash
        run: |
          python mozc4med/tool/append_collocation_entries.py \
            --input "mozc4med-dic-csv/collocation_suppression/*.csv" \
            --target src/data/dictionary_oss/collocation_suppression.txt \
            --columns 2 \
            --apply \
            --log-file append_collocation_suppression_entries.log \
            --added-report append_collocation_suppression_entries_added.tsv \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: upload collocation append logs (test)
        uses: actions/upload-artifact@v6
        with:
          name: append-collocation-entries-log-test
          path: |
            append_collocation_entries.log
            append_collocation_entries_added.tsv
            append_collocation_suppression_entries.log
            append_collocation_suppression_entries_added.tsv
          if-no-files-found: warn

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build evaluation snapshot
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build //data/dictionary_oss:evaluation --config oss_windows -c dbg

      - name: Compare evaluation quality
        shell: bash
        # Gates on OK->FAILED regressions caused by the dictionary/collocation
        # edits above; if the gate passes, syncs evaluation.tsv from the
        # Bazel-generated snapshot so the evaluation_diff_test that runs as
        # part of `runtests` below sees a matching working copy instead of
        # failing with an opaque byte-diff. See
        # mozc4med/tool/compare_evaluation_quality.py's module docstring.
        run: |
          python mozc4med/tool/compare_evaluation_quality.py \
            --after src/bazel-bin/data/dictionary_oss/evaluation_updated.tsv \
            --apply \
            --log-file compare_evaluation_quality.log \
            --quality-report compare_evaluation_quality.tsv \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: upload evaluation quality report (test)
        uses: actions/upload-artifact@v6
        with:
          name: compare-evaluation-quality-log-test
          path: |
            compare_evaluation_quality.log
            compare_evaluation_quality.tsv
          if-no-files-found: warn

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... --config oss_windows -c dbg --build_tests_only

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Validate and apply patches
        shell: bash
        run: |
          python mozc4med/tool/validate_and_apply_patches.py mozc4med/common mozc4med/windows

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py --cache_only
